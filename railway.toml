[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[[services]]
name = "api"
[services.deploy]
startCommand = "uv run uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
[services.scaling]
minInstances = 1
maxInstances = 1

[[services]]
name = "scraper"
[services.deploy]
startCommand = "echo 'Scraper service — runs on cron only'"
[services.cron]
schedule = "*/30 * * * *"
command = "uv run python -m src.scrapers.cron"
